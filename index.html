<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анимация и контент</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
    }

    /* Основной контент, изначально скрыт */
    .content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 800px;
      width: 100%;
      gap: 1.5rem;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .content.visible {
      display: flex;
      opacity: 1;
    }

    /* Текст "ЫЫЫ" — строчный, крупный, без лишних стилей */
    .text-main {
      font-size: 4rem;
      font-weight: 400;
      line-height: 1.2;
      color: #000000;
      letter-spacing: normal;
      word-break: break-word;
    }

    /* Изображение — просто вставляется как есть */
    .content img {
      max-width: 100%;
      height: auto;
      display: block;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    /* Текст "ыыыы" */
    .text-sub {
      font-size: 2rem;
      font-weight: 400;
      color: #000000;
      line-height: 1.3;
    }

    /* Кнопка "Открыть" — красная, без скруглений */
    .open-btn {
      background-color: #ff0000;
      color: #ffffff;
      border: none;
      border-radius: 0;          /* без скруглений */
      padding: 1rem 2.5rem;
      font-size: 1.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
      text-transform: none;
      letter-spacing: 0.5px;
      box-shadow: none;
      outline: none;
      font-family: inherit;
      margin-top: 0.5rem;
    }

    .open-btn:hover {
      background-color: #cc0000;
    }

    .open-btn:active {
      background-color: #990000;
      transform: scale(0.98);
    }

    /* Оверлей с видео на весь экран */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 1000;
      transition: opacity 0.8s ease, filter 0.8s ease, backdrop-filter 0.8s ease;
      pointer-events: none; /* чтобы не блокировать клики после исчезновения */
    }

    /* Видео заполняет весь оверлей */
    .video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* или contain — но для полного экрана лучше cover */
      display: block;
      pointer-events: none; /* видео не должно перехватывать клики */
    }

    /* Класс для плавного размытия и исчезновения */
    .video-overlay.fade-out {
      opacity: 0;
      filter: blur(12px);
      backdrop-filter: blur(12px);
      /* чтобы видео не было видно после исчезновения */
      pointer-events: none;
    }

    /* Убираем отступы у body, когда видео на весь экран */
    body.video-active {
      overflow: hidden;
    }

    /* Адаптив для мобильных */
    @media (max-width: 600px) {
      .text-main {
        font-size: 3rem;
      }
      .text-sub {
        font-size: 1.6rem;
      }
      .open-btn {
        font-size: 1.2rem;
        padding: 0.9rem 1.8rem;
      }
      .content {
        gap: 1.2rem;
        padding: 1.5rem 1rem;
      }
    }

    @media (max-width: 400px) {
      .text-main {
        font-size: 2.5rem;
      }
      .text-sub {
        font-size: 1.3rem;
      }
      .open-btn {
        font-size: 1rem;
        padding: 0.8rem 1.5rem;
      }
    }
  </style>
</head>
<body class="video-active">

  <!-- Оверлей с видео (на весь экран) -->
  <div class="video-overlay" id="videoOverlay">
    <video id="introVideo" autoplay muted playsinline>
      <source src="anim.mp4" type="video/mp4">
      <!-- Если видео не поддерживается — оверлей просто исчезнет -->
    </video>
  </div>

  <!-- Основной контент: текст, картинка, текст, кнопка -->
  <div class="content" id="mainContent">
    <div class="text-main">Shnuk Cooop - технология, благодаря которой вы можете делится файлами до 50мб между устройствами, в том числе устройствами экосистемы Shnuk.</div>
    <img src="image.png" alt="Изображение">
    <div class="text-sub">Технология Cooop Detaling работает через Firebase и позволяет загружать файлы по частям, для удобства последующего их содержания на сервере</div>
    <button class="open-btn" id="openButton">Открыть</button>
  </div>

  <script>
    (function() {
      const videoOverlay = document.getElementById('videoOverlay');
      const introVideo = document.getElementById('introVideo');
      const mainContent = document.getElementById('mainContent');
      const openButton = document.getElementById('openButton');

      // Функция, которая скрывает видео с анимацией и показывает контент
      function showContent() {
        // Убираем блокировку скролла
        document.body.classList.remove('video-active');

        // Плавно размываем и скрываем оверлей
        videoOverlay.classList.add('fade-out');

        // Показываем основной контент с плавным появлением
        mainContent.classList.add('visible');

        // Через некоторое время полностью удаляем оверлей из потока (чтобы не мешал)
        setTimeout(() => {
          if (videoOverlay.parentNode) {
            videoOverlay.style.display = 'none';
          }
        }, 900); // чуть больше длительности transition (0.8s)
      }

      // Обработчик окончания видео
      introVideo.addEventListener('ended', showContent);

      // Если видео не загрузилось или произошла ошибка — показываем контент сразу
      introVideo.addEventListener('error', function() {
        console.warn('Видео не загрузилось, показываем контент сразу.');
        showContent();
      });

      // На случай, если видео не воспроизводится из-за политики автовоспроизведения,
      // запускаем вручную после загрузки метаданных (autoplay + muted обычно работает)
      introVideo.addEventListener('loadeddata', function() {
        // Пытаемся воспроизвести (на случай, если autoplay не сработал)
        introVideo.play().catch(function(error) {
          // Если автовоспроизведение заблокировано — сразу показываем контент
          console.warn('Автовоспроизведение заблокировано:', error);
          showContent();
        });
      });

      // Страховка: если видео по какой-то причине не закончилось в течение 10 секунд,
      // принудительно показываем контент (на случай зависания)
      const safetyTimer = setTimeout(function() {
        if (!mainContent.classList.contains('visible')) {
          console.warn('Таймаут видео, принудительный показ контента.');
          showContent();
        }
      }, 10000); // 10 секунд

      // Очищаем таймер, если видео закончилось нормально
      introVideo.addEventListener('ended', function() {
        clearTimeout(safetyTimer);
      });

      // Обработчик кнопки "Открыть"
      openButton.addEventListener('click', function() {
        window.open('https://glavinmstislav-eng.github.io/shnuk-os/system/e3Blaze', '_blank');
      });

      // На всякий случай, если видео уже было загружено и готово к воспроизведению
      if (introVideo.readyState >= 2) {
        introVideo.play().catch(function() {
          // если не удалось — показываем контент
          showContent();
        });
      }
    })();
  </script>
</body>
</html>
