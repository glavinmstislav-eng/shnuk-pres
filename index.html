<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свайпабельная кнопка · увеличенная</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Кнопка: базовый размер увеличен вдвое (было 300px → стало 600px),
       а масштабы увеличены вдвое (0.25 → 0.5, 0.20 → 0.40),
       чтобы итоговый визуальный размер был ровно в 2 раза больше. */
    .btn {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 600px;               /* было 300px — теперь в 2 раза больше */
      height: auto;
      transform: translate(-50%, -50%) scale(0.5);
      transform-origin: center;
      will-change: transform;
      cursor: grab;
      transition: none;
    }

    .btn.returning {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img src="img-button.png" alt="Кнопка" class="btn" id="btn" draggable="false">
  </div>

  <script>
    (function () {
      const btn = document.getElementById('btn');

      const IMAGES = [
        'img-button.png',
        'img-button2.png',
        'img-button3.png',
        'img-button4.png'
      ];

      // Пороги увеличены вдвое — пропорционально размеру кнопки.
      // Было [60, 130, 220] → стало [120, 260, 440].
      const THRESHOLDS = [120, 260, 440];

      const BASE_SCALE = 0.5;    // было 0.25 — в 2 раза больше
      const PRESS_SCALE = 0.40;  // было 0.20 — в 2 раза больше

      let dragging = false;
      let startX = 0, startY = 0;
      let curX = 0, curY = 0;
      let currentStage = 0;

      function applyTransform(x, y, scale) {
        btn.style.transform =
          `translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;
      }

      function stageFromDistance(d) {
        for (let i = THRESHOLDS.length - 1; i >= 0; i--) {
          if (d >= THRESHOLDS[i]) return i + 1;
        }
        return 0;
      }

      function setStage(stage) {
        if (stage === currentStage) return;
        currentStage = stage;
        btn.src = IMAGES[stage];
      }

      function getPoint(e) {
        if (e.touches && e.touches.length) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function onDown(e) {
        e.preventDefault();
        const p = getPoint(e);
        startX = p.x;
        startY = p.y;
        curX = 0;
        curY = 0;
        dragging = true;

        btn.classList.remove('returning');
        btn.classList.add('dragging');

        setStage(3);
        applyTransform(0, 0, PRESS_SCALE);
      }

      function onMove(e) {
        if (!dragging) return;
        e.preventDefault();

        const p = getPoint(e);
        curX = p.x - startX;
        curY = p.y - startY;
        const dist = Math.hypot(curX, curY);

        setStage(stageFromDistance(dist));

        const scale = dist > 5 ? BASE_SCALE : PRESS_SCALE;
        applyTransform(curX, curY, scale);
      }

      function onUp(e) {
        if (!dragging) return;
        dragging = false;

        btn.classList.remove('dragging');
        btn.classList.add('returning');

        currentStage = 0;
        btn.src = IMAGES[0];
        applyTransform(0, 0, BASE_SCALE);
      }

      btn.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      btn.addEventListener('touchstart', onDown, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onUp);
      window.addEventListener('touchcancel', onUp);
    })();
  </script>
</body>
</html>
